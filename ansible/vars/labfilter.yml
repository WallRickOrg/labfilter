---
# This is the verified software and service baseline of the Raspberry Pi 4.
# Keep machine-specific addresses and Wi-Fi credentials in ignored `.env`.
labfilter_packages:
  - cron
  - network-manager
  - nftables
  - openssh-server
  - wpasupplicant
  - rsyslog

# The current system uses NetworkManager with DHCP for both management Ethernet
# and the Wi-Fi station. The bridge is explicitly unnumbered and does not
# participate in management routing.
labfilter_management_address: "{{ lookup('env', 'LABFILTER_MANAGEMENT_ADDRESS') }}"
labfilter_management_interface: "{{ lookup('env', 'LABFILTER_MANAGEMENT_INTERFACE') }}"
labfilter_device_hostname: labfilter
labfilter_management_connection_name: labfilter-management
labfilter_wifi_interface: "{{ lookup('env', 'LABFILTER_WIFI_INTERFACE') | default('wlan0', true) }}"
labfilter_wifi_connection_name: labfilter-wifi
# The fallback recognizes the prior local name while users migrate their ignored
# `.env`; only the LABFILTER_WIFI_* names appear in the safe committed sample.
labfilter_wifi_ssid: "{{ lookup('env', 'LABFILTER_WIFI_SSID') | default(lookup('env', 'LABFILTER_LANWIFI_SSID'), true) }}"
labfilter_wifi_psk: "{{ (lookup('env', 'LABFILTER_WIFI_PSK_BASE64') | default(lookup('env', 'LABFILTER_LANWIFI_PSK_BASE64'), true)) | b64decode }}"

# The approved transparent bridge uses a bridge-family nftables forward hook.
# It remains separate from the management interface and carries no L3 address.
labfilter_nftables_enabled: true
labfilter_bridge_name: br0
labfilter_bridge_interfaces:
  - eth0
  - eth1

# These source networks are management paths, not destinations to evaluate
# against the country-based deny sets. Keep them ahead of every block rule.
labfilter_bridge_always_allowed_ipv4:
  - 192.168.86.0/24
  # The WireGuard client must be able to initiate traffic without being caught
  # by fixed or learned destination deny sets on the transparent bridge.
  - 192.168.2.9
  - 100.64.0.0/10
labfilter_bridge_always_allowed_ipv6:
  - fd7a:115c:a1e0::/48

# The WireGuard client gets narrow ICMP and tunnel-handshake exceptions only.
# Other protocols from this address remain subject to fixed and GeoIP blocks.
labfilter_wireguard_client_ipv4: 192.168.2.9
labfilter_wireguard_allowed_udp_ports:
  - 51820

# This fixed test policy follows the earlier Labfilter intent: the bridge
# forwards normally except for a current controller-side DNS snapshot.
# The current hostname is a test input; the event label describes the generic
# blocked-policy path because future deny rules use the same event pipeline.
labfilter_block_rule_name: Block policy
labfilter_block_domains:
  - cnn.com
  - www.cnn.com
labfilter_block_ipv4: []
labfilter_block_ipv6: []

# The external Docker server address is private topology, so it stays in the
# ignored environment file and is used only by the host-local rsyslog forwarder.
labfilter_elk_logstash_host: "{{ lookup('env', 'LABFILTER_ELK_LOGSTASH_HOST') | default('', true) }}"
labfilter_elk_logstash_port: 5514

# The hourly blocker queries only aggregated destination addresses and GeoIP
# country codes. The server address remains in ignored local configuration.
labfilter_elasticsearch_url: >-
  {{ lookup('env', 'LABFILTER_ELASTICSEARCH_URL')
     | default('http://' + lookup('env', 'LABFILTER_ELK_LOGSTASH_HOST') + ':9200', true) }}
labfilter_geo_block_index_pattern: labfilter-*
labfilter_geo_block_lookback_hours: 12
labfilter_geo_block_aggregation_page_size: 1000
labfilter_geo_block_request_timeout_seconds: 30
labfilter_geo_block_state_directory: /var/lib/labfilter
labfilter_geo_block_state_file: /var/lib/labfilter/geo-blocks.json
labfilter_geo_block_include_file: /var/lib/labfilter/geo-block-elements.nft
# These countries are the conservative Five Eyes baseline for this home lab.
# Keep the list here, rather than in .env, so policy changes are reviewable.
labfilter_geo_block_allowed_countries:
  - AU
  - CA
  - GB
  - NZ
  - US

# These destinations are resolved at each hourly run and excluded from the
# country-based deny set; no provider IP is hard-coded into the repository.
labfilter_geo_block_protected_hostnames:
  - api.openai.com
  - auth.openai.com
  - chatgpt.com
  - chat.openai.com
  - codex.openai.com
  - codex.com
  - github.com
  - ssh.github.com
  - api.github.com
  - raw.githubusercontent.com
  - objects.githubusercontent.com
  - codeload.github.com
  - gist.githubusercontent.com
  - ghcr.io
  # Docker Hub authentication and registry endpoints must remain reachable
  # even when their current CDN address is classified outside the allowlist.
  # Keep the suffix protection below as the broad policy for observed Docker
  # Hub hostnames; these exact names cover pulls when reverse-DNS enrichment
  # is unavailable or stale.
  - auth.docker.io
  - registry-1.docker.io
  - index.docker.io
  - registry.npmjs.org
# Reverse-DNS names ending in these suffixes are removed from the learned
# destination deny inventory, including newly added Docker Hub endpoints.
labfilter_geo_block_protected_hostname_suffixes:
  - .docker.io
