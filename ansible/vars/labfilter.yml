---
# This is the verified software and service baseline of the Raspberry Pi 4.
# Keep machine-specific addresses and Wi-Fi credentials in ignored `.env`.
labfilter_packages:
  - network-manager
  - nftables
  - openssh-server
  - wpasupplicant
  - rsyslog

# The current system uses NetworkManager with DHCP for both management Ethernet
# and the Wi-Fi station. The bridge is explicitly unnumbered and does not
# participate in management routing.
labfilter_management_address: "{{ lookup('env', 'LABFILTER_MANAGEMENT_ADDRESS') }}"
labfilter_management_interface: "{{ lookup('env', 'LABFILTER_MANAGEMENT_INTERFACE') }}"
labfilter_device_hostname: labfilter
labfilter_management_connection_name: labfilter-management
labfilter_wifi_interface: "{{ lookup('env', 'LABFILTER_WIFI_INTERFACE') | default('wlan0', true) }}"
labfilter_wifi_connection_name: labfilter-wifi
# The fallback recognizes the prior local name while users migrate their ignored
# `.env`; only the LABFILTER_WIFI_* names appear in the safe committed sample.
labfilter_wifi_ssid: "{{ lookup('env', 'LABFILTER_WIFI_SSID') | default(lookup('env', 'LABFILTER_LANWIFI_SSID'), true) }}"
labfilter_wifi_psk: "{{ (lookup('env', 'LABFILTER_WIFI_PSK_BASE64') | default(lookup('env', 'LABFILTER_LANWIFI_PSK_BASE64'), true)) | b64decode }}"

# The approved transparent bridge uses a bridge-family nftables forward hook.
# It remains separate from the management interface and carries no L3 address.
labfilter_nftables_enabled: true
labfilter_bridge_name: br0
labfilter_bridge_interfaces:
  - eth0
  - eth1

# This fixed test policy follows the earlier Labfilter intent: the bridge
# forwards normally except for a current controller-side DNS snapshot.
labfilter_block_rule_name: Block CNN
labfilter_block_domains:
  - cnn.com
  - www.cnn.com
labfilter_block_ipv4: []
labfilter_block_ipv6: []

# The external Docker server address is private topology, so it stays in the
# ignored environment file and is used only by the host-local rsyslog forwarder.
labfilter_elk_logstash_host: "{{ lookup('env', 'LABFILTER_ELK_LOGSTASH_HOST') | default('', true) }}"
labfilter_elk_logstash_port: 5514
