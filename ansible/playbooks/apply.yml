---
- name: Apply guarded OpenWrt configuration
  hosts: openwrt
  gather_facts: false
  vars_files:
    - ../vars/openwrt.yml
  pre_tasks:
    - name: Require explicit confirmation before applying any change
      ansible.builtin.assert:
        that:
          - openwrt_apply_confirmed | bool
          - openwrt_allow_local_access | bool
        fail_msg: >-
          Refusing to apply: set both openwrt_apply_confirmed=true and
          openwrt_allow_local_access=true after reviewing the change.

    - name: Refuse unguarded network or firewall changes
      ansible.builtin.assert:
        that:
          - openwrt_allow_network_changes | bool
          - openwrt_management_address | length > 0
          - openwrt_management_interface | length > 0
        fail_msg: >-
          Network/firewall changes require openwrt_allow_network_changes=true,
          openwrt_management_address, and openwrt_management_interface.
      when: >-
        ('network' in openwrt_config_templates)
        or ('firewall' in openwrt_config_templates)
        or (openwrt_nft_templates | length > 0)
        or (openwrt_uci_set | select('match', '^(network|firewall)\.') | list | length > 0)
        or (openwrt_uci_delete | select('match', '^(network|firewall)\.') | list | length > 0)
        or (openwrt_uci_add_list | select('match', '^(network|firewall)\.') | list | length > 0)

    - name: Require the local management address guard for protected templates
      ansible.builtin.assert:
        that:
          - openwrt_management_address | length > 0
          - openwrt_management_interface | length > 0
        fail_msg: >-
          The live network/firewall templates require OPENWRT_MANAGEMENT_ADDRESS
          and OPENWRT_MANAGEMENT_INTERFACE in the ignored .env.
      when: >-
        ('network' in openwrt_config_templates)
        or ('firewall' in openwrt_config_templates)
        or (openwrt_nft_templates | length > 0)

    - name: Confirm current local management access before protected changes
      ansible.builtin.raw: >-
        /sbin/ip -4 addr show dev {{ openwrt_management_interface | quote }} |
        grep -F -- {{ openwrt_management_address | quote }}
      changed_when: false
      when: >-
        ('network' in openwrt_config_templates)
        or ('firewall' in openwrt_config_templates)
        or (openwrt_nft_templates | length > 0)

    - name: Require externalized values needed by the reproduced templates
      ansible.builtin.assert:
        that:
          - openwrt_device_hostname | length > 0
          - openwrt_ula_prefix | length > 0
          - openwrt_wan_ip | length > 0
          - openwrt_management_cidr | length > 0
          - openwrt_upstream_cidr | length > 0
          - openwrt_upstream_address | length > 0
          - openwrt_lanwifi_ssid | length > 0
          - openwrt_lanwifi_psk | length > 0
          - openwrt_rpcd_password | length > 0
          - openwrt_block_rule_name | length > 0
          - openwrt_block_rule_name is match('^[A-Za-z0-9 _-]+$')
          - openwrt_bridge_interfaces | length == 2
          - openwrt_bridge_interfaces | select('match', '^[A-Za-z0-9_.:-]+$') | list | length == openwrt_bridge_interfaces | length
          - openwrt_block_cnn_ipv4 | length > 0
          - openwrt_block_cnn_ipv4 | select('match', '^([0-9]{1,3}\\.){3}[0-9]{1,3}$') | list | length == openwrt_block_cnn_ipv4 | length
          - openwrt_block_cnn_ipv6 | length > 0
          - openwrt_block_cnn_ipv6 | select('match', '^[0-9A-Fa-f:]+$') | list | length == openwrt_block_cnn_ipv6 | length
          - openwrt_proxmox_address is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
          - openwrt_proxmox_web_port is match('^[0-9]+$')
          - openwrt_proxmox_web_port | int > 0
          - openwrt_proxmox_web_port | int < 65536
        fail_msg: >-
          One or more required host-specific or secret template values are
          missing or invalid in the ignored .env.
      when: openwrt_config_templates | length > 0

    - name: Verify UCI is available before changing state
      ansible.builtin.raw: "test -x /sbin/uci"
      changed_when: false

    - name: Save a remote backup before applying configuration
      ansible.builtin.raw: >-
        backup="/tmp/openwrt-ansible-backup-$(date +%Y%m%d%H%M%S).tar.gz";
        tar -czf "$backup" /etc/config;
        printf '%s' "$backup"
      register: openwrt_backup
      changed_when: true
      no_log: true

  tasks:
    - name: Stage verified OpenWrt packages through the controller
      # The router has no outbound feed access, so the controller downloads the
      # exact kernel-matched package and transfers it over the guarded SSH path.
      block:
        - name: Create a private controller package directory
          ansible.builtin.tempfile:
            state: directory
            prefix: openwrt-packages-
          register: openwrt_package_stage
          delegate_to: localhost
          become: false

        - name: Download checksum-pinned OpenWrt packages
          ansible.builtin.get_url:
            url: "{{ item.url | regex_replace('\\s+', '') }}"
            dest: "{{ openwrt_package_stage.path }}/{{ item.filename }}"
            checksum: "sha256:{{ item.sha256 }}"
            mode: "0600"
          loop: "{{ openwrt_packages }}"
          delegate_to: localhost
          become: false

        - name: Upload packages with the OpenWrt-compatible SCP protocol
          # Dropbear exposes legacy SCP but not an SFTP subsystem; forcing SCP
          # keeps binary transfer independent of Python on the target.
          ansible.builtin.command:
            argv:
              - scp
              - -O
              - -P
              - "{{ ansible_port | default(22) | string }}"
              - -i
              - "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') }}"
              - -o
              - BatchMode=yes
              - -o
              - IdentitiesOnly=yes
              - -o
              - StrictHostKeyChecking=yes
              - "{{ openwrt_package_stage.path }}/{{ item.filename }}"
              - "{{ ansible_user }}@{{ ansible_host }}:/tmp/{{ item.filename }}"
          loop: "{{ openwrt_packages }}"
          delegate_to: localhost
          become: false
          no_log: true

        - name: Verify uploaded package checksums on OpenWrt
          ansible.builtin.raw: >-
            echo {{ item.sha256 | quote }} /tmp/{{ item.filename | quote }} |
            sha256sum -c -
          loop: "{{ openwrt_packages }}"
          changed_when: false

        - name: Install required OpenWrt packages from local staging
          # opkg still validates the package architecture and exact running
          # kernel dependency before installing the bridge-family module.
          ansible.builtin.raw: >-
            if opkg status {{ item.name | quote }} 2>/dev/null |
            grep -q 'Status:.*installed'; then
              printf '%s\n' already-installed;
            else
              opkg install /tmp/{{ item.filename | quote }};
            fi
          loop: "{{ openwrt_packages }}"
          register: openwrt_package_install
          # During a loop Ansible may expose the aggregate register before an
          # item result; defaulting stdout keeps status reporting deterministic.
          changed_when: >-
            'already-installed' not in
            (openwrt_package_install.stdout | default(''))
      always:
        - name: Remove staged packages from OpenWrt
          # Package files are transient controller inputs, not router desired
          # state, so remove only the explicitly pinned staging paths.
          ansible.builtin.raw: "rm -f /tmp/{{ item.filename | quote }}"
          loop: "{{ openwrt_packages }}"
          changed_when: false

        - name: Remove the private controller package directory
          ansible.builtin.file:
            path: "{{ openwrt_package_stage.path }}"
            state: absent
          delegate_to: localhost
          become: false
          when:
            - openwrt_package_stage is defined
            - openwrt_package_stage.path is defined
      when: openwrt_packages | length > 0

    - name: Render and upload verified UCI configuration templates
      # The target image does not provide base64; shell quoting keeps the
      # rendered content intact while still avoiding an intermediate file.
      ansible.builtin.raw: >-
        printf '%s' {{ lookup('template', playbook_dir + '/../templates/uci/' + item + '.j2') | quote }} >
        /etc/config/{{ item | quote }}
      loop: "{{ openwrt_config_templates }}"
      when: openwrt_config_templates | length > 0
      no_log: true

    - name: Render and upload the bridge-family nftables policy
      # This minimal image has no coreutils install command; BusyBox mkdir and
      # chmod create the firewall4 include directory with explicit permissions.
      ansible.builtin.raw: >-
        mkdir -p /usr/share/nftables.d/ruleset-pre;
        chmod 0755 /usr/share/nftables.d/ruleset-pre;
        printf '%s' {{ lookup('template', playbook_dir + '/../templates/nft/' + item + '.nft.j2') | quote }} >
        /usr/share/nftables.d/ruleset-pre/99-openwrt-{{ item }}.nft
      loop: "{{ openwrt_nft_templates }}"
      when: openwrt_nft_templates | length > 0
      no_log: true

    - name: Set verified UCI values
      ansible.builtin.raw: "/sbin/uci set {{ item | quote }}"
      loop: "{{ openwrt_uci_set }}"
      when: openwrt_uci_set | length > 0

    - name: Delete verified UCI values
      ansible.builtin.raw: "/sbin/uci delete {{ item | quote }}"
      loop: "{{ openwrt_uci_delete }}"
      when: openwrt_uci_delete | length > 0

    - name: Add verified UCI list values
      ansible.builtin.raw: "/sbin/uci add_list {{ item | quote }}"
      loop: "{{ openwrt_uci_add_list }}"
      when: openwrt_uci_add_list | length > 0

    - name: Commit only the explicitly listed UCI configuration files
      ansible.builtin.raw: "/sbin/uci commit {{ item | quote }}"
      loop: "{{ openwrt_uci_commit }}"
      when: openwrt_uci_commit | length > 0

    - name: Reload only the explicitly listed services
      ansible.builtin.raw: "/etc/init.d/{{ item | quote }} reload"
      loop: "{{ openwrt_services_reload }}"
      when: openwrt_services_reload | length > 0

    - name: Verify the obsolete Proxmox redirect is absent
      # Transparent bridge traffic retains the Proxmox destination and must not
      # be translated as though it terminated on an OpenWrt routed interface.
      ansible.builtin.raw: >-
        if uci show firewall | grep -F "name='Proxmox-Web-Forward'"; then
          exit 1;
        fi;
        if nft list chain inet fw4 dstnat_lan 2>/dev/null |
        grep -F 'Proxmox-Web-Forward'; then
          exit 1;
        fi
      changed_when: false

    - name: Verify the obsolete Proxmox host route is absent
      # An unnumbered transparent bridge does not route to its downstream host;
      # frames retain their original L2 path across the two member ports.
      ansible.builtin.raw: >-
        if ip -4 route show exact {{ (openwrt_proxmox_address + '/32') | quote }}
        dev br-lan | grep -q .; then
          exit 1;
        fi
      changed_when: false
      when: openwrt_proxmox_address | length > 0

    - name: Verify the Proxmox bridge allow is loaded when deployed
      # Bridge-family validation checks the hook that sees transparent frames;
      # an inet fw4 or LuCI traffic rule would validate the wrong packet path.
      ansible.builtin.raw: >-
        nft list chain bridge openwrt_bridge_filter forward |
        grep -F 'Proxmox-Web-Allow'
      changed_when: false
      when: "'bridge-filter' in openwrt_nft_templates"

    - name: Verify Block CNN is enforced at the bridge hook
      # The legacy LuCI traffic rule used the routed inet hook and was a false
      # signal; validate the active L2 chain and every configured set element.
      ansible.builtin.raw: >-
        nft list chain bridge openwrt_bridge_filter forward |
        grep -F {{ ('openwrt: ' + openwrt_block_rule_name) | quote }};
        {% for address in openwrt_block_cnn_ipv4 %}
        nft list set bridge openwrt_bridge_filter block_cnn_ipv4 |
        grep -F {{ address | quote }};
        {% endfor %}
        {% for address in openwrt_block_cnn_ipv6 %}
        nft list set bridge openwrt_bridge_filter block_cnn_ipv6 |
        grep -F {{ address | quote }};
        {% endfor %}
        if uci show firewall |
        grep -F {{ ("name='" + openwrt_block_rule_name + "'") | quote }}; then
          exit 1;
        fi
      changed_when: false
      when: "'bridge-filter' in openwrt_nft_templates"

    - name: Confirm the management address remains present after changes
      ansible.builtin.raw: >-
        /sbin/ip -4 addr show dev {{ openwrt_management_interface | quote }} |
        grep -F -- {{ openwrt_management_address | quote }}
      changed_when: false
      when:
        - openwrt_allow_network_changes | bool
        - openwrt_management_address | length > 0
        - openwrt_management_interface | length > 0
