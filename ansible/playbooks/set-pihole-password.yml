---
# Change only the native Pi-hole credential; this playbook intentionally does
# not touch nftables, NetworkManager, bridge membership, or other services.
- name: Set the guarded native Pi-hole password
  hosts: labfilter
  become: true
  gather_facts: true
  vars_files:
    - ../vars/labfilter.yml
  pre_tasks:
    - name: Require explicit password-change confirmation
      ansible.builtin.assert:
        that:
          - labfilter_pihole_enabled | bool
          - labfilter_pihole_webpassword_base64 | length > 0
          - labfilter_password_apply_confirmed | default(false) | bool
        fail_msg: >-
          Set labfilter_password_apply_confirmed=true and provide
          LABFILTER_PIHOLE_WEBPASSWORD_BASE64 in the ignored .env.
      no_log: true

    - name: Confirm the managed Pi-hole address is present
      ansible.builtin.command:
        argv:
          - ip
          - -4
          - address
          - show
          - dev
          - "{{ labfilter_pihole_interface }}"
      register: labfilter_pihole_address_check
      changed_when: false
      failed_when: labfilter_pihole_address not in labfilter_pihole_address_check.stdout
      no_log: true

  tasks:
    - name: Set the native Pi-hole API/web password
      # Use Pi-hole's interactive setter so punctuation in the password is
      # treated as password data rather than as a config value.
      ansible.builtin.command:
        argv:
          - pihole
          - setpassword
        stdin: "{{ labfilter_pihole_webpassword }}\n{{ labfilter_pihole_webpassword }}\n"
        stdin_add_newline: false
      no_log: true

    - name: Restart Pi-hole FTL after the credential change
      ansible.builtin.systemd_service:
        name: pihole-FTL
        state: restarted

    - name: Confirm Pi-hole FTL is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - pihole-FTL
      register: labfilter_pihole_service_state
      changed_when: false
      failed_when: labfilter_pihole_service_state.stdout | trim != 'active'
