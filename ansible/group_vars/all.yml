---
# These empty lists make an undiscovered configuration a safe no-op.
openwrt_uci_set: []
openwrt_uci_delete: []
openwrt_uci_add_list: []
openwrt_uci_commit: []
openwrt_services_reload: []
# Wireless process recovery is opt-in so generic inventories cannot disrupt a
# radio unless verified desired-state variables explicitly enable it.
openwrt_reload_wireless: false
# Package staging is opt-in so a generic inventory cannot download or install
# software until a verified desired-state file supplies pinned package data.
openwrt_packages: []

# Applying changes is opt-in so an incomplete local checkout cannot alter the bridge.
openwrt_apply_confirmed: false
openwrt_allow_local_access: false

# Network and firewall changes require a separate explicit guard.
openwrt_allow_network_changes: false
openwrt_management_address: ""
openwrt_management_interface: ""
