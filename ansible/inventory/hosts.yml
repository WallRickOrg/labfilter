all:
  hosts:
    labfilter:
      # The wrapper exports LABFILTER_HOST and LABFILTER_SSH_USER from the ignored .env file.
      ansible_host: "{{ lookup('env', 'LABFILTER_HOST') | default('192.0.2.1', true) }}"
      ansible_user: "{{ lookup('env', 'LABFILTER_SSH_USER') | default('root', true) }}"
      ansible_connection: ssh
      # OpenWrt commonly has no Python runtime, so playbooks use raw/command-compatible tasks.
      ansible_python_interpreter: auto_silent
