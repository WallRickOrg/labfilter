all:
  hosts:
    openwrt:
      # The wrapper exports OPENWRT_HOST and OPENWRT_SSH_USER from the ignored .env file.
      ansible_host: "{{ lookup('env', 'OPENWRT_HOST') | default('192.0.2.1', true) }}"
      ansible_user: "{{ lookup('env', 'OPENWRT_SSH_USER') | default('root', true) }}"
      ansible_connection: ssh
      # OpenWrt commonly has no Python runtime, so playbooks use raw/command-compatible tasks.
      ansible_python_interpreter: auto_silent
