---
all:
  hosts:
    labfilter:
      # The wrapper exports only ignored local connection values from `.env`.
      ansible_host: "{{ lookup('env', 'LABFILTER_HOST') }}"
      ansible_user: "{{ lookup('env', 'LABFILTER_SSH_USER') | default('labfilter', true) }}"
      ansible_port: "{{ lookup('env', 'LABFILTER_SSH_PORT') | default('22', true) }}"
      ansible_connection: ssh
      ansible_python_interpreter: auto_silent
