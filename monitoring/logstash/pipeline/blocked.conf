input {
  # Labfilter's rsyslog forwards only kernel messages with this managed prefix.
  udp {
    host => "0.0.0.0"
    port => 5514
    # Use Logstash's built-in plain codec. The 9.5.4 image does not include
    # the optional syslog codec; the filter only needs the raw message text.
  }
}

filter {
  # Keep the pipeline defensive if another source reaches the UDP listener.
  if [message] !~ /LABFILTER_(?:BLOCKED|TRAFFIC)/ {
    drop { }
  }

  # Parse rsyslog's RFC 5424 envelope without relying on the optional syslog
  # codec, which is not included in the Logstash 9.5.4 image.
  grok {
    match => {
      "message" => "^<(?<syslog_priority>[0-9]+)>(?<syslog_version>[0-9]+) (?<syslog_timestamp>[^ ]+) (?<syslog_hostname>[^ ]+) (?<syslog_appname>[^ ]+) (?<syslog_procid>[^ ]+) (?<syslog_msgid>[^ ]+) (?<syslog_structured_data>[^ ]+) +(?<nftables_payload>LABFILTER_(?<labfilter_event>BLOCKED|TRAFFIC) .*)$"
    }
    tag_on_failure => ["_labfilter_syslog_parse_failure"]
  }

  mutate {
    rename => {
      "syslog_priority" => "[syslog][priority]"
      "syslog_version" => "[syslog][version]"
      "syslog_timestamp" => "[syslog][timestamp]"
      "syslog_hostname" => "[syslog][hostname]"
      "syslog_appname" => "[syslog][appname]"
      "syslog_procid" => "[syslog][procid]"
      "syslog_msgid" => "[syslog][msgid]"
      "syslog_structured_data" => "[syslog][structured_data]"
      "nftables_payload" => "[@metadata][nftables_payload]"
    }
  }

  if [@metadata][nftables_payload] {
    # Parse nftables' whitespace-separated KEY=VALUE tokens into a dedicated
    # object before mapping the common network fields below.
    mutate {
      gsub => [
        "[@metadata][nftables_payload]", "^LABFILTER_(?:BLOCKED|TRAFFIC)\s+", "",
        "[@metadata][nftables_payload]", "[\r\n]+$", ""
      ]
    }
    kv {
      source => "[@metadata][nftables_payload]"
      target => "[nftables]"
      field_split => " "
      value_split => "="
      trim_key => " "
      trim_value => " "
    }
    date {
      match => ["[syslog][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  mutate {
    # Copy packet endpoints into ECS fields before normalizing the remaining
    # nftables values; copy avoids losing the source object during field moves.
    copy => {
      "[nftables][SRC]" => "[source][ip]"
      "[nftables][DST]" => "[destination][ip]"
      "[nftables][SPT]" => "[source][port]"
      "[nftables][DPT]" => "[destination][port]"
    }
    rename => {
      "[nftables][MAC]" => "[nftables][mac]"
      "[nftables][LEN]" => "[network][bytes]"
      "[nftables][TOS]" => "[nftables][tos]"
      "[nftables][PREC]" => "[nftables][precedence]"
      "[nftables][TTL]" => "[nftables][ttl]"
      "[nftables][ID]" => "[nftables][id]"
      "[nftables][WINDOW]" => "[nftables][window]"
      "[nftables][RES]" => "[nftables][reserved]"
      "[nftables][URGP]" => "[nftables][urgent_pointer]"
      "[nftables][PROTO]" => "[network][transport]"
      "[nftables][IN]" => "[network][ingress][interface]"
      "[nftables][OUT]" => "[network][egress][interface]"
    }
    lowercase => ["[network][transport]"]
  }

  # Run type conversion after copying endpoint fields so ports are indexed as
  # numbers regardless of the mutate plugin's internal operation order.
  mutate {
    convert => {
      "[source][port]" => "integer"
      "[destination][port]" => "integer"
      "[network][bytes]" => "integer"
      "[nftables][ttl]" => "integer"
      "[nftables][id]" => "integer"
      "[nftables][window]" => "integer"
      "[nftables][urgent_pointer]" => "integer"
    }
  }

  # Enrich public endpoint addresses with the bundled GeoLite2 City database.
  # Private and reserved addresses simply receive a lookup-failure tag and do
  # not prevent the original network event from being indexed.
  geoip {
    source => "[source][ip]"
    # ECS mode writes geo fields under source.geo when target is source.
    target => "[source]"
    tag_on_failure => ["_source_geoip_lookup_failure"]
  }
  geoip {
    source => "[destination][ip]"
    # ECS mode writes geo fields under destination.geo when target is destination.
    target => "[destination]"
    tag_on_failure => ["_destination_geoip_lookup_failure"]
  }

  # nftables emits destination and source MAC addresses as one 12-octet value.
  grok {
    match => {
      "[nftables][mac]" => "^%{MAC:[destination][mac]}:%{MAC:[source][mac]}:(?<ether_type>[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2})$"
    }
    tag_on_failure => ["_labfilter_mac_parse_failure"]
  }

  mutate {
    rename => { "ether_type" => "[nftables][ether_type]" }
  }

  # nftables emits TCP flags as standalone tokens instead of KEY=VALUE pairs.
  if [message] =~ /(?:^|\s)DF(?:\s|$)/ {
    mutate { add_field => { "[nftables][flags]" => "DF" } }
  }
  if [message] =~ /(?:^|\s)SYN(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "SYN" } } }
  if [message] =~ /(?:^|\s)ACK(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "ACK" } } }
  if [message] =~ /(?:^|\s)FIN(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "FIN" } } }
  if [message] =~ /(?:^|\s)RST(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "RST" } } }
  if [message] =~ /(?:^|\s)PSH(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "PSH" } } }
  if [message] =~ /(?:^|\s)URG(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "URG" } } }
  if [message] =~ /(?:^|\s)ECE(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "ECE" } } }
  if [message] =~ /(?:^|\s)CWR(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "CWR" } } }
  if [message] =~ /(?:^|\s)NS(?:\s|$)/ { mutate { add_field => { "[nftables][flags]" => "NS" } } }

  mutate {
    add_field => {
      "[event][kind]" => "event"
      "[event][category]" => "network"
      "[event][type]" => "connection"
    }
  }
  if [labfilter_event] == "BLOCKED" {
    mutate { add_field => { "[event][action]" => "blocked" "[labfilter][policy]" => "Block CNN" } }
  } else {
    mutate { add_field => { "[event][action]" => "allowed" } }
  }
}

output {
  if [event][action] == "blocked" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "labfilter-blocked"
      ilm_enabled => true
      ilm_rollover_alias => "labfilter-blocked"
      ilm_pattern => "000001"
      ilm_policy => "labfilter-blocked-weekly"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "labfilter-traffic"
      ilm_enabled => true
      ilm_rollover_alias => "labfilter-traffic"
      ilm_pattern => "000001"
      ilm_policy => "labfilter-traffic-weekly"
    }
  }
}
