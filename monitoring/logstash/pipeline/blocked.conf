input {
  # Labfilter's rsyslog forwards only kernel messages with this managed prefix.
  udp {
    host => "0.0.0.0"
    port => 5514
    # Use Logstash's built-in plain codec. The 9.5.4 image does not include
    # the optional syslog codec; the filter only needs the raw message text.
  }
}

filter {
  # Keep the pipeline defensive if another source reaches the UDP listener.
  if [message] !~ /LABFILTER_BLOCKED/ {
    drop { }
  }

  # Parse rsyslog's RFC 5424 envelope without relying on the optional syslog
  # codec, which is not included in the Logstash 9.5.4 image.
  grok {
    match => {
      "message" => "^<%{POSINT:[syslog][priority]}>%{POSINT:[syslog][version]} %{TIMESTAMP_ISO8601:[syslog][timestamp]} %{HOSTNAME:[syslog][hostname]} %{DATA:[syslog][appname]} %{DATA:[syslog][procid]} %{DATA:[syslog][msgid]} %{GREEDYDATA:[@metadata][nftables_payload]}$"
    }
    tag_on_failure => ["_labfilter_syslog_parse_failure"]
  }

  if [@metadata][nftables_payload] {
    # Parse nftables' whitespace-separated KEY=VALUE tokens into a dedicated
    # object before mapping the common network fields below.
    mutate {
      gsub => ["[@metadata][nftables_payload]", "^LABFILTER_BLOCKED\\s+", ""]
    }
    kv {
      source => "[@metadata][nftables_payload]"
      target => "[nftables]"
      field_split => " "
      value_split => "="
      trim_key => " "
      trim_value => " "
    }
    date {
      match => ["[syslog][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  mutate {
    rename => {
      "[nftables][MAC]" => "[nftables][mac]"
      "[nftables][SRC]" => "[source][ip]"
      "[nftables][DST]" => "[destination][ip]"
      "[nftables][SPT]" => "[source][port]"
      "[nftables][DPT]" => "[destination][port]"
      "[nftables][PROTO]" => "[network][transport]"
      "[nftables][IN]" => "[network][ingress][interface]"
      "[nftables][OUT]" => "[network][egress][interface]"
    }
    convert => {
      "[source][port]" => "integer"
      "[destination][port]" => "integer"
    }
    lowercase => ["[network][transport]"]
  }

  # nftables emits destination and source MAC addresses as one 12-octet value.
  grok {
    match => {
      "[nftables][mac]" => "^%{MAC:[destination][mac]}:%{MAC:[source][mac]}(?::[0-9A-Fa-f]{2}){2}$"
    }
    tag_on_failure => ["_labfilter_mac_parse_failure"]
  }

  mutate {
    add_field => {
      "[event][kind]" => "event"
      "[event][category]" => "network"
      "[event][type]" => "connection"
      "[event][action]" => "blocked"
      "[labfilter][policy]" => "Block CNN"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "labfilter-blocked"
    ilm_enabled => true
    ilm_rollover_alias => "labfilter-blocked"
    ilm_pattern => "000001"
    ilm_policy => "labfilter-blocked-weekly"
  }
}
